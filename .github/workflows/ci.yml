name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Check frontend JavaScript
        run: node --check site/nostr/nostr-client.js
      - name: Run tests
        run: pytest -q

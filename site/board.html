<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VoxVera — Bulletin Board</title>
    <link rel="stylesheet" href="nostr-client.css">
  </head>
  <body class="board-page">
    <header class="topbar">
      <div>
        <h1 id="board-title">Bulletin Board</h1>
        <p id="board-subtitle">Most recent flyers published to the relays.</p>
      </div>
      <div class="topbar-controls">
        <a id="board-back" class="board-back" href="./">Back to VoxVera</a>
        <select id="board-lang" aria-label="Language"></select>
      </div>
    </header>
    <main class="board-main">
      <p id="board-status">Loading…</p>
      <table class="board-table" id="board-table">
        <thead><tr id="board-head"></tr></thead>
        <tbody id="board-rows"></tbody>
      </table>
    </main>
    <script src="locales.js"></script>
    <script src="vendor/nostr-tools/nostr.bundle.js"></script>
    <script src="board.js"></script>
  </body>
</html>

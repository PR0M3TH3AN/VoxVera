<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=/">
    <title>VoxVera</title>
    <script>
      // The client now lives at the site root. /nostr/ is kept only so older
      // poster URLs and printed QR codes (https://.../nostr/#naddr1... or
      // ?addr=...) still resolve. Forward to root, preserving query + fragment.
      window.location.replace("/" + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p><a href="/">Open VoxVera</a></p>
  </body>
</html>
